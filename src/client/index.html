<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Robattle Arena</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- ===================== juego ===================== -->
  <div id="game" class="hidden">
    <canvas id="view"></canvas>

    <div id="hud">
      <div id="topbar">
        <div class="team-side left" id="team0"></div>
        <div id="scorebox" class="panel">
          <div id="score"><span class="t0" id="score0"></span><span id="round">R1</span><span class="t1" id="score1"></span></div>
          <div id="clock">0:00</div>
          <div id="next"></div>
        </div>
        <div class="team-side right" id="team1"></div>
      </div>
      <div id="banner"></div>
      <div id="count"></div>
      <div id="bars"></div>
    </div>

    <div id="pause" class="overlay hidden">
      <div class="panel menu-box">
        <h2>PAUSA</h2>
        <div class="keys" id="pause-keys"></div>
        <button class="btn" id="btn-resume" data-back>Continuar</button>
        <button class="btn ghost" id="btn-quit">Abandonar</button>
      </div>
    </div>

    <div id="results" class="overlay hidden">
      <div class="panel menu-box wide">
        <h2 id="res-title">¡VICTORIA!</h2>
        <div id="res-score"></div>
        <table id="res-table"></table>
        <div class="row">
          <button class="btn big" id="btn-again">Revancha</button>
          <button class="btn" id="btn-lobby">Volver a la sala</button>
          <button class="btn ghost" id="btn-menu" data-back>Menú</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== menús ===================== -->
  <div id="menus">
    <section id="scr-title" class="screen">
      <div class="logo">
        <div class="logo-top">ROBATTLE</div>
        <div class="logo-bot">ARENA</div>
      </div>
      <div id="title-bots"></div>
      <div class="menu-col">
        <button class="btn big" data-go="lobby">Jugar (1v1 / 2v2)</button>
        <button class="btn big" data-go="mp">Multijugador LAN</button>
        <button class="btn" data-go="champs">Campeones</button>
        <button class="btn" data-go="options">Opciones y controles</button>
      </div>
      <div class="foot" id="title-foot"></div>
    </section>

    <section id="scr-lobby" class="screen hidden">
      <h1 id="lobby-title">Sala</h1>
      <p class="hint" id="lobby-hint"></p>
      <div class="row" id="lobby-opts">
        <button class="btn" id="opt-size">Modo: 1v1</button>
        <button class="btn" id="opt-wins">Rondas: 3</button>
        <button class="btn" id="opt-arena">Arena: Parque</button>
        <button class="btn" id="opt-diff">Bots: Normal</button>
      </div>
      <div id="teams">
        <div class="team panel t0"><h3>EQUIPO AZUL</h3><div class="slots" id="slots0"></div></div>
        <div class="vs">VS</div>
        <div class="team panel t1"><h3>EQUIPO ROJO</h3><div class="slots" id="slots1"></div></div>
      </div>
      <div id="lobby-detail" class="panel"></div>
      <div class="row">
        <button class="btn ghost" id="lobby-back" data-back>Volver</button>
        <button class="btn" id="lobby-kb">Unirse con teclado</button>
        <button class="btn" id="lobby-ready">¡Listo!</button>
        <button class="btn big" id="lobby-start">¡Robattle!</button>
      </div>
    </section>

    <section id="scr-mp" class="screen hidden">
      <h1>Multijugador LAN</h1>
      <div class="panel form">
        <label>Tu nombre <input id="mp-name" maxlength="12" autocomplete="off" /></label>
        <button class="btn big" id="mp-create">Crear sala</button>
        <div class="sep">o únete con un código</div>
        <div class="row">
          <input id="mp-code" maxlength="4" placeholder="ABCD" autocomplete="off" />
          <button class="btn" id="mp-join">Unirse</button>
        </div>
        <p class="hint" id="mp-hint"></p>
        <p class="err" id="mp-err"></p>
      </div>
      <button class="btn ghost" data-go="title" data-back>Volver</button>
    </section>

    <section id="scr-champs" class="screen hidden">
      <h1>Campeones</h1>
      <div id="champ-tabs" class="row"></div>
      <div id="champ-detail" class="panel"></div>
      <button class="btn ghost" data-go="title" data-back>Volver</button>
    </section>

    <section id="scr-options" class="screen hidden">
      <h1>Opciones</h1>
      <div class="panel form">
        <label>Nombre <input id="opt-name" maxlength="12" autocomplete="off" /></label>
        <label>Volumen <input id="opt-vol" type="range" min="0" max="1" step="0.05" /></label>
        <label class="check"><input id="opt-mute" type="checkbox" /> Silencio</label>
        <label class="check"><input id="opt-dmg" type="checkbox" /> Números de daño</label>
        <label class="check"><input id="opt-shake" type="checkbox" /> Sacudidas de pantalla</label>
        <label class="check"><input id="opt-assist" type="checkbox" /> Ayuda a apuntar con mando</label>
        <div class="keys" id="opt-keys"></div>
      </div>
      <button class="btn ghost" data-go="title" data-back>Volver</button>
    </section>
  </div>

  <div id="toast"></div>
  <button id="sndhint" class="hidden">🔇 Haz clic o pulsa una tecla para activar el sonido</button>
  <script type="module" src="./main.ts"></script>
</body>
</html>
